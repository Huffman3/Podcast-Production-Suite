<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Episode Performance",
  "schemaVersion": 1
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episode Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0f0f0f; color:#f0ece3; font-family:Georgia,'Times New Roman',serif; min-height:100vh; padding:28px 24px; }

.header { border-bottom:1px solid #242424; padding-bottom:20px; margin-bottom:24px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.show-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a84c; margin-bottom:5px; font-family:'Courier New',monospace; }
.title { font-size:28px; font-weight:normal; }
.updated { font-size:11px; color:#4a4a4a; font-family:'Courier New',monospace; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
.stat-card { background:#171717; border:1px solid #242424; border-radius:3px; padding:16px 18px; }
.stat-label { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:#555; margin-bottom:10px; font-family:'Courier New',monospace; }
.stat-value { font-size:26px; color:#f0ece3; line-height:1; }
.stat-value.gold  { color:#c9a84c; }
.stat-value.green { color:#5aab7d; }
.stat-sub { font-size:10px; color:#454545; margin-top:6px; font-family:'Courier New',monospace; }

.chart-wrap { background:#171717; border:1px solid #242424; border-radius:3px; padding:20px 20px 16px; margin-bottom:28px; }
.chart-header { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:#555; font-family:'Courier New',monospace; margin-bottom:14px; }

.section-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:#444; font-family:'Courier New',monospace; border-bottom:1px solid #1e1e1e; padding-bottom:7px; margin-bottom:12px; }

.ep-table { width:100%; border-collapse:collapse; margin-bottom:30px; font-size:13px; }
.ep-table th { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#444; font-family:'Courier New',monospace; padding:8px 12px; text-align:left; border-bottom:1px solid #1e1e1e; font-weight:normal; }
.ep-table td { padding:11px 12px; border-bottom:1px solid #1a1a1a; vertical-align:middle; color:#c8c4bc; }
.ep-table tr:hover td { background:#141414; }
.ep-num   { color:#555; font-family:'Courier New',monospace; font-size:11px; width:52px; }
.ep-title { color:#f0ece3; }
.ep-date  { font-family:'Courier New',monospace; font-size:11px; color:#555; white-space:nowrap; }
.ep-dl    { font-family:'Courier New',monospace; color:#c9a84c; text-align:right; white-space:nowrap; }
.vs-avg   { font-family:'Courier New',monospace; font-size:11px; text-align:right; white-space:nowrap; }
.vs-avg.up   { color:#5aab7d; }
.vs-avg.down { color:#c05454; }
.vs-avg.flat { color:#555; }
.rep-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
.rep-full    { background:#5aab7d; }
.rep-partial { background:#d4883a; }
.rep-none    { background:#c05454; }

.gaps { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.gap-card { background:#171717; border:1px solid #242424; border-left:3px solid #c05454; border-radius:3px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.gap-card.partial { border-left-color:#d4883a; }
.gap-warn { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#c05454; font-family:'Courier New',monospace; margin-bottom:5px; }
.gap-card.partial .gap-warn { color:#d4883a; }
.gap-ep   { font-size:14px; color:#f0ece3; }
.gap-dl   { font-size:12px; color:#c9a84c; font-family:'Courier New',monospace; margin-top:3px; }
.gap-missing { display:flex; gap:6px; flex-wrap:wrap; }
.missing-tag { font-size:9px; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:2px; font-family:'Courier New',monospace; background:rgba(192,84,84,.12); color:#c05454; border:1px solid rgba(192,84,84,.2); }
.gap-card.partial .missing-tag { background:rgba(212,136,58,.12); color:#d4883a; border:1px solid rgba(212,136,58,.2); }

.state-msg { text-align:center; padding:60px 20px; font-family:'Courier New',monospace; font-size:12px; letter-spacing:1px; color:#444; }
.state-msg.error { color:#c05454; }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid #2a2a2a; border-top-color:#c9a84c; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

.no-gaps { font-family:'Courier New',monospace; font-size:12px; color:#333; padding:16px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="show-label" id="ep-count-label">Loading…</div>
    <div class="title">Episode Performance</div>
  </div>
  <div class="updated" id="updated-time"></div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-label">Total Downloads</div><div class="stat-value gold" id="s-total">—</div><div class="stat-sub" id="s-total-sub">—</div></div>
  <div class="stat-card"><div class="stat-label">Last 30 Days</div><div class="stat-value" id="s-30d">—</div><div class="stat-sub" id="s-30d-sub">—</div></div>
  <div class="stat-card"><div class="stat-label">Best Episode</div><div class="stat-value green" id="s-best">—</div><div class="stat-sub" id="s-best-sub">—</div></div>
  <div class="stat-card"><div class="stat-label">Avg Per Episode</div><div class="stat-value" id="s-avg">—</div><div class="stat-sub" id="s-avg-sub">—</div></div>
</div>

<div class="chart-wrap" id="chart-wrap" style="display:none">
  <div class="chart-header">Downloads by Episode</div>
  <canvas id="dlChart" height="85"></canvas>
</div>

<div id="state-display" class="state-msg"><span class="spinner"></span>Loading from Google Sheets…</div>

<div id="main-content" style="display:none">
  <div class="section-label">Episode Breakdown</div>
  <table class="ep-table">
    <thead>
      <tr>
        <th>#</th><th>Title</th><th>Published</th>
        <th style="text-align:right">Downloads</th>
        <th style="text-align:right">vs Avg</th>
        <th>Repurposed</th>
      </tr>
    </thead>
    <tbody id="ep-tbody"></tbody>
  </table>

  <div class="section-label">Content Gap Alerts</div>
  <div class="gaps" id="gaps-list"></div>
</div>

<script>
const DEMO_SHEET_ID   = '1xSBdh6omlci1ckMJfV5_rjDpQVruPzHpDDY-j5JApiE';
const SPREADSHEET_ID  = localStorage.getItem('podcastDashboardSheetId') || DEMO_SHEET_ID;
const IS_DEMO         = !localStorage.getItem('podcastDashboardSheetId');
const MCP_TOOL = 'mcp__8935aad1-1da9-45a2-9cb4-f22ab8e10861__google_sheets_get_data_range';
const GAP_DL_THRESHOLD = 15000;

let chartInst = null;

const fmtNum  = n => n.toLocaleString('en-US');
const repConf = {
  full:    { cls:'rep-full',    txt:'Full' },
  partial: { cls:'rep-partial', txt:'Partial' },
  none:    { cls:'rep-none',    txt:'None' }
};

async function loadData() {
  try {
    const res = await window.cowork.callMcpTool(MCP_TOOL, {
      instructions: 'Get all episode performance rows',
      spreadsheet: SPREADSHEET_ID,
      worksheet: 'Episodes',
      a1_range: 'A1:F200',
      output_hint: 'all rows and columns as raw data'
    });

    const rows = (res.results || []).slice(1).filter(r => r['COL$A'] && r['COL$D']);
    const episodes = rows.map(r => ({
      num:     parseInt(r['COL$A']) || 0,
      title:   r['COL$B'] || '',
      date:    r['COL$C'] || '',
      dl:      parseInt(r['COL$D']) || 0,
      rep:     (r['COL$E'] || 'full').toLowerCase().trim(),
      missing: (r['COL$F'] || '').split('|').map(s => s.trim()).filter(Boolean)
    }));

    if (!episodes.length) {
      document.getElementById('state-display').textContent = 'No episode data found in the sheet.';
      return;
    }

    const total   = episodes.reduce((s, e) => s + e.dl, 0);
    const avg     = Math.round(total / episodes.length);
    const best    = episodes.reduce((b, e) => e.dl > b.dl ? e : b, episodes[0]);

    const now      = new Date();
    const cutoff30 = new Date(now - 30 * 24 * 60 * 60 * 1000);
    const recent   = episodes.filter(e => {
      const d = new Date(e.date);
      return !isNaN(d) && d >= cutoff30;
    });
    const dl30 = recent.reduce((s, e) => s + e.dl, 0);

    const storedShowName  = localStorage.getItem('podcastDashboardShowName');
    const storedSeason    = localStorage.getItem('podcastDashboardSeasonLabel');
    const showLine        = storedShowName
      ? storedShowName + (storedSeason ? ' · ' + storedSeason : '')
      : 'Who Killed…? · Season 3';
    document.querySelector('.show-label').textContent = showLine;

    if (IS_DEMO) {
      const b = document.createElement('div');
      b.style.cssText = 'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:3px;color:#7a6530;font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:1px;padding:8px 14px;margin-bottom:20px;';
      b.textContent = '⚠ Using demo data — run the Setup Wizard to connect your sheet.';
      document.getElementById('main-content').before(b);
    }

    document.getElementById('ep-count-label').textContent =
      'Last ' + episodes.length + ' Episodes';
    document.getElementById('s-total').textContent  = fmtNum(total);
    document.getElementById('s-total-sub').textContent = 'Ep ' + Math.min(...episodes.map(e=>e.num)) + '–' + Math.max(...episodes.map(e=>e.num));
    document.getElementById('s-30d').textContent   = fmtNum(dl30);
    document.getElementById('s-30d-sub').textContent = recent.length + ' episode' + (recent.length !== 1 ? 's' : '');
    document.getElementById('s-best').textContent  = fmtNum(best.dl);
    document.getElementById('s-best-sub').textContent = 'Ep ' + best.num + ' · ' + best.title.substring(0, 28) + (best.title.length > 28 ? '…' : '');
    document.getElementById('s-avg').textContent   = fmtNum(avg);
    document.getElementById('s-avg-sub').textContent = 'rolling ' + episodes.length + '-ep avg';

    const sorted = [...episodes].sort((a, b) => a.num - b.num);
    document.getElementById('chart-wrap').style.display = 'block';
    if (chartInst) chartInst.destroy();
    const ctx = document.getElementById('dlChart').getContext('2d');
    chartInst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: sorted.map(e => 'Ep ' + e.num),
        datasets: [{
          data: sorted.map(e => e.dl),
          backgroundColor: sorted.map(e => e.dl >= avg * 1.2 ? 'rgba(201,168,76,0.75)' : e.dl >= avg * 0.9 ? 'rgba(201,168,76,0.35)' : 'rgba(201,168,76,0.18)'),
          borderColor:     sorted.map(e => e.dl >= avg * 1.2 ? 'rgba(201,168,76,1)'    : e.dl >= avg * 0.9 ? 'rgba(201,168,76,0.5)'  : 'rgba(201,168,76,0.3)'),
          borderWidth: 1, borderRadius: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor:'#1a1a1a', borderColor:'#2a2a2a', borderWidth:1,
            titleColor:'#c9a84c', bodyColor:'#f0ece3',
            callbacks: { label: c => ' ' + c.raw.toLocaleString() + ' downloads' }
          }
        },
        scales: {
          x: { grid:{ color:'#1a1a1a' }, ticks:{ color:'#555', font:{ family:'Courier New', size:10 } } },
          y: { grid:{ color:'#1e1e1e' }, ticks:{ color:'#555', font:{ family:'Courier New', size:10 }, callback: v => (v/1000).toFixed(0)+'k' } }
        }
      }
    });

    document.getElementById('ep-tbody').innerHTML = episodes.map(e => {
      const diff   = e.dl - avg;
      const pct    = Math.round((diff / avg) * 100);
      const vsCls  = pct > 5 ? 'up' : pct < -5 ? 'down' : 'flat';
      const vsTxt  = (pct > 0 ? '+' : '') + pct + '%';
      const rc     = repConf[e.rep] || repConf['full'];
      return `<tr>
        <td class="ep-num">Ep ${e.num}</td>
        <td class="ep-title">${e.title}</td>
        <td class="ep-date">${e.date}</td>
        <td class="ep-dl">${fmtNum(e.dl)}</td>
        <td class="vs-avg ${vsCls}">${vsTxt}</td>
        <td><span class="rep-dot ${rc.cls}"></span><span style="color:#666;font-family:'Courier New',monospace;font-size:10px">${rc.txt}</span></td>
      </tr>`;
    }).join('');

    const gapEps = episodes.filter(e => e.rep !== 'full' && e.dl >= GAP_DL_THRESHOLD);
    if (gapEps.length) {
      document.getElementById('gaps-list').innerHTML = gapEps.map(e => {
        const isNone = e.rep === 'none';
        const pct    = Math.round((e.dl / avg - 1) * 100);
        return `<div class="gap-card${isNone ? '' : ' partial'}">
          <div>
            <div class="gap-warn">${isNone ? '⚠ No repurposing' : '↗ Partial repurposing'}</div>
            <div class="gap-ep">Ep ${e.num} · ${e.title}</div>
            <div class="gap-dl">${fmtNum(e.dl)} downloads · ${pct >= 0 ? '+' : ''}${pct}% vs avg</div>
          </div>
          <div class="gap-missing">
            ${e.missing.map(m => `<span class="missing-tag">${m} missing</span>`).join('')}
          </div>
        </div>`;
      }).join('');
    } else {
      document.getElementById('gaps-list').innerHTML = '<div class="no-gaps">All high-performing episodes are fully repurposed. ✓</div>';
    }

    document.getElementById('state-display').style.display = 'none';
    document.getElementById('main-content').style.display  = 'block';
    document.getElementById('updated-time').textContent =
      'Updated ' + now.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'});

  } catch(e) {
    const detail = e && e.message ? e.message : String(e);
    const el = document.getElementById('state-display');
    el.className = 'state-msg error';
    el.innerHTML =
      '<div style="font-size:20px;margin-bottom:10px">⚠</div>' +
      '<div style="font-size:13px;color:#c05454;margin-bottom:8px">Google Sheets connector unavailable</div>' +
      '<div style="font-size:11px;color:#555;margin-bottom:16px;line-height:1.7">' +
        'Reconnect your Google Sheets connector in Cowork settings, then reload this artifact.<br>' +
        '<span style="color:#333;font-size:10px">(' + detail + ')</span>' +
      '</div>' +
      '<button onclick="loadData()" style="background:none;border:1px solid rgba(201,168,76,.4);color:#c9a84c;font-family:\'Courier New\',monospace;font-size:11px;padding:7px 18px;border-radius:3px;cursor:pointer;letter-spacing:.05em">↻ Try Again</button>';
  }
}

loadData();
</script>
</body>
</html>
