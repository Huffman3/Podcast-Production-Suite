<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Anti Ai Checker",
  "schemaVersion": 1,
  "description": "Paste any text and get a Human Score (0–100) plus color-coded flags for: forbidden AI words (delve, leverage, robust…), forbidden phrases (it's important to note, in today's digital age…), staccato patterns (No X. No Y.), and repeated sentence openers. Switches to a highlighted view showing exactly what needs fixing."
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-AI Writing Checker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #f0ece3;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid #242424;
    background: #0f0f0f;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo {
    width: 28px; height: 28px;
    background: #c9a84c;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; color: #0f0f0f;
    font-family: 'Courier New', monospace;
  }
  .topbar-title { font-size: 16px; color: #f0ece3; letter-spacing: 0.02em; }
  .topbar-sub {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #555;
    letter-spacing: 0.05em;
  }

  .score-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 24px;
    background: #111;
    border-bottom: 1px solid #1e1e1e;
    flex-shrink: 0;
  }
  .score-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #555;
    white-space: nowrap;
  }
  .score-track {
    flex: 1;
    height: 6px;
    background: #242424;
    border-radius: 3px;
    overflow: hidden;
  }
  .score-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease, background 0.5s ease;
    width: 0%;
    background: #555;
  }
  .score-num {
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    min-width: 48px;
    text-align: right;
    transition: color 0.4s;
    color: #555;
  }
  .score-verdict {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #555;
    min-width: 120px;
    letter-spacing: 0.04em;
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e1e1e;
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #1e1e1e;
    flex-shrink: 0;
  }
  .panel-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9a84c;
  }
  .tab-row { display: flex; gap: 4px; }
  .tab {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    color: #555;
    background: none;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: #f0ece3; border-color: #333; background: #1e1e1e; }
  .tab:hover:not(.active) { color: #888; }

  .input-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    min-height: 0;
  }
  textarea#inputText {
    width: 100%;
    height: 100%;
    min-height: 300px;
    background: #0f0f0f;
    border: 1px solid #242424;
    color: #f0ece3;
    font-family: Georgia, serif;
    font-size: 15px;
    line-height: 1.7;
    padding: 16px;
    border-radius: 3px;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea#inputText:focus { border-color: #333; }
  textarea#inputText::placeholder { color: #333; font-style: italic; }

  .output-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    min-height: 0;
    display: none;
  }
  .highlighted-text {
    font-family: Georgia, serif;
    font-size: 15px;
    line-height: 1.7;
    color: #ccc;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .flag-word    { background: #3d1a1a; color: #e87070; border-radius: 2px; padding: 0 2px; cursor: help; }
  .flag-phrase  { background: #3a2800; color: #e8a850; border-radius: 2px; padding: 0 2px; cursor: help; }
  .flag-staccato { background: #1a2a3a; color: #6aa8d4; border-radius: 2px; padding: 0 2px; cursor: help; }
  .flag-repeat  { background: #2a1a3a; color: #b07ae8; border-radius: 2px; padding: 0 2px; cursor: help; }

  .action-bar {
    padding: 12px 20px;
    border-top: 1px solid #1e1e1e;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn-check {
    background: #c9a84c;
    color: #0f0f0f;
    border: none;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 20px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-check:hover { background: #d4b45e; }
  .btn-clear {
    background: none;
    border: 1px solid #2a2a2a;
    color: #555;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clear:hover { border-color: #444; color: #888; }
  .word-count {
    margin-left: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #3a3a3a;
  }

  .right-panel {
    overflow-y: auto;
    padding: 0;
  }
  .issues-section {
    border-bottom: 1px solid #1a1a1a;
  }
  .issues-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .issues-section-head:hover { background: #141414; }
  .issues-section-title {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .issue-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    font-size: 10px;
    font-weight: bold;
    padding: 0 5px;
  }
  .count-red    { background: #3d1a1a; color: #e87070; }
  .count-orange { background: #3a2800; color: #e8a850; }
  .count-blue   { background: #1a2a3a; color: #6aa8d4; }
  .count-purple { background: #2a1a3a; color: #b07ae8; }
  .count-gray   { background: #222; color: #666; }
  .section-arrow {
    font-size: 10px;
    color: #444;
    transition: transform 0.2s;
  }
  .section-arrow.open { transform: rotate(90deg); }
  .issues-list {
    padding: 0 16px 12px;
  }
  .issue-item {
    padding: 7px 10px;
    border-radius: 3px;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .issue-item-word {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .issue-item-note {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #666;
    line-height: 1.4;
  }
  .issue-red    { background: #1e0e0e; border-left: 2px solid #e87070; }
  .issue-orange { background: #1e1400; border-left: 2px solid #e8a850; }
  .issue-blue   { background: #0e1820; border-left: 2px solid #6aa8d4; }
  .issue-purple { background: #180e20; border-left: 2px solid #b07ae8; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #333;
    line-height: 1.7;
  }
  .empty-icon { font-size: 28px; margin-bottom: 12px; opacity: 0.4; }

  .legend {
    padding: 14px 16px;
    border-bottom: 1px solid #1a1a1a;
  }
  .legend-title {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #555;
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .left-panel { border-right: none; border-bottom: 1px solid #1e1e1e; }
    .right-panel { max-height: 300px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">✗</div>
    <div>
      <div class="topbar-title">Anti-AI Writing Checker</div>
      <div class="topbar-sub">Paste text · Get flagged · Write human</div>
    </div>
  </div>
</div>

<div class="score-bar">
  <div class="score-label">Human Score</div>
  <div class="score-track">
    <div class="score-fill" id="scoreFill"></div>
  </div>
  <div class="score-num" id="scoreNum">—</div>
  <div class="score-verdict" id="scoreVerdict">Paste text to analyze</div>
</div>

<div class="main">

  <div class="left-panel">
    <div class="panel-header">
      <div class="panel-label">Your Text</div>
      <div class="tab-row">
        <button class="tab active" id="tabInput" onclick="switchTab('input')">Input</button>
        <button class="tab" id="tabOutput" onclick="switchTab('output')">Highlighted</button>
      </div>
    </div>
    <div class="input-area" id="inputArea">
      <textarea id="inputText" placeholder="Paste your writing here and hit Check Writing…&#10;&#10;Try something like: 'Leveraging AI tools can unlock potential, allowing for a more robust creative process in today's digital landscape.'"
        oninput="updateWordCount()"></textarea>
    </div>
    <div class="output-area" id="outputArea">
      <div class="highlighted-text" id="highlightedText"></div>
    </div>
    <div class="action-bar">
      <button class="btn-check" onclick="runCheck()">Check Writing</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
      <span class="word-count" id="wordCount">0 words</span>
    </div>
  </div>

  <div class="right-panel" id="rightPanel">

    <div class="legend">
      <div class="legend-title">Flag Legend</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e87070"></div>Forbidden word</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e8a850"></div>Forbidden phrase</div>
      <div class="legend-item"><div class="legend-dot" style="background:#6aa8d4"></div>Staccato pattern</div>
      <div class="legend-item"><div class="legend-dot" style="background:#b07ae8"></div>Repeated sentence opener</div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✎</div>
      Paste your text on the left<br>and hit <strong style="color:#c9a84c">Check Writing</strong><br>to see what needs fixing.
    </div>

    <div id="issuesSections" style="display:none"></div>

  </div>
</div>

<script>
const FORBIDDEN_WORDS = [
  'delve','leverage','harness','robust','landscape','utilize','realm',
  'transformative','game-changer','gamechanger','seamless','testament',
  'leveraging','harnessing','utilizing'
];

const FORBIDDEN_PHRASES = [
  "it's important to note",
  "it is important to note",
  "in today's digital age",
  "in today's world",
  "unpack",
  "at the end of the day",
  "furthermore",
  "moreover",
  "it goes without saying",
  "in conclusion",
  "let that sink in",
  "in summary",
  "to summarize",
];

const STACCATO_PATTERNS = [
  { re: /\bno\s+\w[\w\s,]*\.\s+no\s+\w/gi, label: '"No X. No Y." pattern' },
  { re: /it'?s not\s+[\w\s]+,\s+it'?s\s+/gi, label: '"It\'s not X, it\'s Y." pattern' },
];

let currentTab = 'input';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabInput').className  = 'tab' + (tab === 'input'  ? ' active' : '');
  document.getElementById('tabOutput').className = 'tab' + (tab === 'output' ? ' active' : '');
  document.getElementById('inputArea').style.display  = tab === 'input'  ? '' : 'none';
  document.getElementById('outputArea').style.display = tab === 'output' ? '' : 'none';
}

function updateWordCount() {
  const text = document.getElementById('inputText').value.trim();
  const words = text ? text.split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words + (words === 1 ? ' word' : ' words');
}

function clearAll() {
  document.getElementById('inputText').value = '';
  updateWordCount();
  document.getElementById('scoreNum').textContent = '—';
  document.getElementById('scoreNum').style.color = '#555';
  document.getElementById('scoreFill').style.width = '0%';
  document.getElementById('scoreFill').style.background = '#555';
  document.getElementById('scoreVerdict').textContent = 'Paste text to analyze';
  document.getElementById('emptyState').style.display = '';
  document.getElementById('issuesSections').style.display = 'none';
  document.getElementById('highlightedText').innerHTML = '';
  switchTab('input');
}

function runCheck() {
  const text = document.getElementById('inputText').value;
  if (!text.trim()) return;

  const issues = {
    words:    [],
    phrases:  [],
    staccato: [],
    repeat:   [],
  };

  FORBIDDEN_WORDS.forEach(w => {
    const re = new RegExp('\\b' + w + '\\b', 'gi');
    let m;
    while ((m = re.exec(text)) !== null) {
      issues.words.push({ match: m[0], index: m.index, len: m[0].length });
    }
  });

  FORBIDDEN_PHRASES.forEach(p => {
    const re = new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let m;
    while ((m = re.exec(text)) !== null) {
      issues.phrases.push({ match: m[0], index: m.index, len: m[0].length });
    }
  });

  STACCATO_PATTERNS.forEach(({ re, label }) => {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      issues.staccato.push({ match: m[0], index: m.index, len: m[0].length, label });
    }
  });

  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const starterRe = /^\s*([A-Za-z']+)/;
  let prevStarter = null;
  let searchPos = 0;
  sentences.forEach(s => {
    const m = starterRe.exec(s);
    const idx = text.indexOf(s, searchPos);
    if (m) {
      const starter = m[1].toLowerCase();
      if (starter === prevStarter && starter.length > 1) {
        issues.repeat.push({
          match: m[1],
          index: idx,
          len: m[1].length,
          label: `"${m[1]}" starts two consecutive sentences`
        });
      }
      prevStarter = starter;
    }
    if (idx !== -1) searchPos = idx + s.length;
  });

  const flagMap = new Array(text.length).fill(null);

  const applyFlags = (items, type) => {
    items.forEach(item => {
      for (let i = item.index; i < item.index + item.len && i < text.length; i++) {
        if (!flagMap[i]) flagMap[i] = type;
      }
    });
  };
  applyFlags(issues.repeat,   'repeat');
  applyFlags(issues.staccato, 'staccato');
  applyFlags(issues.phrases,  'phrase');
  applyFlags(issues.words,    'word');

  let html = '';
  let i = 0;
  while (i < text.length) {
    const type = flagMap[i];
    if (type) {
      let j = i + 1;
      while (j < text.length && flagMap[j] === type) j++;
      const snippet = escHtml(text.slice(i, j));
      const cls = type === 'word' ? 'flag-word'
                : type === 'phrase' ? 'flag-phrase'
                : type === 'staccato' ? 'flag-staccato'
                : 'flag-repeat';
      const tooltip = type === 'word'    ? 'Forbidden word'
                    : type === 'phrase'  ? 'Forbidden phrase'
                    : type === 'staccato'? 'Staccato pattern'
                    : 'Repeated sentence opener';
      html += `<mark class="${cls}" title="${tooltip}">${snippet}</mark>`;
      i = j;
    } else {
      html += escHtml(text[i]);
      i++;
    }
  }
  document.getElementById('highlightedText').innerHTML = html;

  let score = 100;
  score -= issues.words.length    * 8;
  score -= issues.phrases.length  * 12;
  score -= issues.staccato.length * 10;
  score -= issues.repeat.length   * 6;
  score = Math.max(0, Math.min(100, score));

  const scoreColor = score >= 80 ? '#5aab7d' : score >= 55 ? '#c9a84c' : '#e87070';
  const verdict    = score >= 80 ? 'Reads human' : score >= 55 ? 'Needs work' : 'Very AI-like';

  document.getElementById('scoreNum').textContent  = score;
  document.getElementById('scoreNum').style.color  = scoreColor;
  document.getElementById('scoreFill').style.width = score + '%';
  document.getElementById('scoreFill').style.background = scoreColor;
  document.getElementById('scoreVerdict').textContent   = verdict;
  document.getElementById('scoreVerdict').style.color   = scoreColor;

  const totalIssues = issues.words.length + issues.phrases.length +
                      issues.staccato.length + issues.repeat.length;

  document.getElementById('emptyState').style.display = totalIssues === 0 ? '' : 'none';
  const sectionsEl = document.getElementById('issuesSections');
  sectionsEl.style.display = totalIssues === 0 ? 'none' : '';

  sectionsEl.innerHTML = [
    buildSection('Forbidden Words',    issues.words,    'red',    'count-red',
      i => `<div class="issue-item-word" style="color:#e87070">${escHtml(i.match)}</div>
            <div class="issue-item-note">Remove or replace with plain language.</div>`),
    buildSection('Forbidden Phrases',  issues.phrases,  'orange', 'count-orange',
      i => `<div class="issue-item-word" style="color:#e8a850">"${escHtml(i.match)}"</div>
            <div class="issue-item-note">Cut it or rewrite more directly.</div>`),
    buildSection('Staccato Patterns',  issues.staccato, 'blue',   'count-blue',
      i => `<div class="issue-item-word" style="color:#6aa8d4">${escHtml(i.label || i.match)}</div>
            <div class="issue-item-note">Vary your sentence structure.</div>`),
    buildSection('Repeated Openers',   issues.repeat,   'purple', 'count-purple',
      i => `<div class="issue-item-word" style="color:#b07ae8">${escHtml(i.label || i.match)}</div>
            <div class="issue-item-note">Start the next sentence differently.</div>`),
  ].join('');

  switchTab('output');
}

function buildSection(title, items, color, countClass, renderItem) {
  const count = items.length;
  const countBadge = count > 0
    ? `<span class="issue-count ${countClass}">${count}</span>`
    : `<span class="issue-count count-gray">0</span>`;

  const seen = new Set();
  const unique = items.filter(i => {
    const k = (i.match || '').toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  const itemsHtml = count === 0
    ? `<div style="font-family:'Courier New',monospace;font-size:10px;color:#3a3a3a;padding:4px 0">None found ✓</div>`
    : unique.map(i => `<div class="issue-item issue-${color}">${renderItem(i)}</div>`).join('');

  return `
    <div class="issues-section">
      <div class="issues-section-head" onclick="toggleSection(this)">
        <div class="issues-section-title" style="color:${count > 0 ? '#ccc' : '#444'}">
          ${countBadge} ${title}
        </div>
        <span class="section-arrow open">▶</span>
      </div>
      <div class="issues-list">${itemsHtml}</div>
    </div>`;
}

function toggleSection(head) {
  const list  = head.nextElementSibling;
  const arrow = head.querySelector('.section-arrow');
  const open  = list.style.display !== 'none';
  list.style.display  = open ? 'none' : '';
  arrow.classList.toggle('open', !open);
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

updateWordCount();
</script>
</body>
</html>
