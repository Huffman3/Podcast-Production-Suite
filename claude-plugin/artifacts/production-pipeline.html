<script>
// ─── Data ─────────────────────────────────────────────────────────────────────
const KEY = 'wkPipeline';

const STAGES = ['Discovery','Research','Outline','Scripting','Recording','Editing','Published','Shelved'];
const ACTIVE  = ['Discovery','Research','Outline','Scripting','Recording','Editing'];

const ICON = {
  Discovery:'🔍', Research:'📋', Outline:'📝',
  Scripting:'✍️', Recording:'🎙', Editing:'✂️',
  Published:'✅', Shelved:'🗄'
};

const BADGE = {
  Discovery:  'color:#666;border-color:#333;background:#161616',
  Research:   'color:#4a7fc1;border-color:#1e3050;background:#0e1f33',
  Outline:    'color:#c9a84c;border-color:#3a2a00;background:#1a1400',
  Scripting:  'color:#c9a84c;border-color:#3a2a00;background:#1a1400',
  Recording:  'color:#5aab7d;border-color:#1e4434;background:#0e2a1e',
  Editing:    'color:#5aab7d;border-color:#1e4434;background:#0e2a1e',
  Published:  'color:#5aab7d;border-color:#1e4434;background:#0e2a1e',
  Shelved:    'color:#444;border-color:#222;background:#141414',
};

let cases    = [];
let curTab   = 'All';
let editId   = null;
let outlineId = null;
const expanded = new Set(); // case IDs with outline panel open

// ─── Bootstrap ────────────────────────────────────────────────────────────────
function loadData() {
  try { cases = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch { cases = []; }
  // Migrate older records to include outline field
  cases = cases.map(c => ({
    ...c,
    outline: c.outline || { coldOpen:'', timeline:'', suspects:'', structure:'', production:'', generatedAt:'' }
  }));
}
function persist() {
  localStorage.setItem(KEY, JSON.stringify(cases));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

window.addEventListener('DOMContentLoaded', () => {
  loadData();
  populateSelects();
  render();
});

function populateSelects() {
  ['nStage','eStage'].forEach(id => {
    const sel = document.getElementById(id);
    STAGES.forEach(s => {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = ICON[s] + ' ' + s;
      sel.appendChild(o);
    });
  });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderTabs();
  renderStats();
  renderList();
}

function hasOutline(c) {
  const o = c.outline || {};
  return !!(o.coldOpen || o.timeline || o.suspects || o.structure || o.production);
}

function renderStats() {
  const get = stage => cases.filter(c => c.stage === stage).length;
  document.getElementById('sActive').textContent    = cases.filter(c => ACTIVE.includes(c.stage)).length;
  document.getElementById('sScripting').textContent = get('Scripting');
  document.getElementById('sRecording').textContent = get('Recording');
  document.getElementById('sPublished').textContent = get('Published');
  document.getElementById('sShelved').textContent   = get('Shelved');
  document.getElementById('sOutlined').textContent  = cases.filter(hasOutline).length;
}

function renderTabs() {
  const tabs = ['All', ...STAGES];
  document.getElementById('tabsRow').innerHTML = tabs.map(t => {
    const n = t === 'All' ? cases.length : cases.filter(c => c.stage === t).length;
    return '<button class="tab-btn' + (t===curTab?' active':'') + '" onclick="setTab(\'' + t + '\')">' +
      (t!=='All' ? ICON[t]+' ' : '') + t +
      '<span class="tab-count">' + n + '</span>' +
      '</button>';
  }).join('');
}

function setTab(t) { curTab = t; render(); }

function renderList() {
  const list = document.getElementById('casesList');
  const filtered = curTab === 'All' ? [...cases] : cases.filter(c => c.stage === curTab);

  const label = curTab === 'All'
    ? 'All Cases' + (cases.length ? ' ('+cases.length+')' : '')
    : ICON[curTab] + ' ' + curTab + (filtered.length ? ' ('+filtered.length+')' : '');
  document.getElementById('sectionLabel').textContent = label;

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">' +
      '<div class="empty-icon">' + (curTab==='All'?'📂':ICON[curTab]) + '</div>' +
      '<div class="empty-msg">' + (curTab==='All'?'No cases yet — add your first above.':'No cases in '+curTab+' stage.') + '</div>' +
      '</div>';
    return;
  }

  list.innerHTML = filtered.map(c => caseWrapperHTML(c)).join('');
}

function age(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d === 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
}
function stageIdx(s) { return STAGES.indexOf(s); }

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function caseWrapperHTML(c) {
  const isOpen = expanded.has(c.id);
  return '<div class="case-wrapper">' +
    caseRowHTML(c, isOpen) +
    '<div class="outline-panel" id="op-' + c.id + '" style="display:' + (isOpen?'block':'none') + '">' +
      outlinePanelHTML(c) +
    '</div>' +
    '</div>';
}

function caseRowHTML(c, outlineOpen) {
  const idx  = stageIdx(c.stage);
  const meta = [c.location, c.year].filter(Boolean).join(' · ');
  const next = STAGES[idx+1];
  const canFwd      = idx < STAGES.length - 2;
  const isShelved   = c.stage === 'Shelved';
  const isPublished = c.stage === 'Published';
  const outlined    = hasOutline(c);

  const actions = [];
  actions.push('<button class="act outline-act' + (outlineOpen?' open':'') + '" onclick="toggleOutline(\'' + c.id + '\')">' + (outlineOpen?'▲':'▼') + ' Outline</button>');
  if (canFwd && !isShelved)
    actions.push('<button class="act fwd" onclick="moveFwd(\'' + c.id + '\')">→ ' + esc(next) + '</button>');
  if (isPublished)
    actions.push('<button class="act pub" onclick="archive(\'' + c.id + '\')">Archive</button>');
  actions.push('<button class="act" onclick="openEdit(\'' + c.id + '\')">Edit</button>');
  if (!isShelved && !isPublished)
    actions.push('<button class="act" onclick="shelveCase(\'' + c.id + '\')">Shelve</button>');
  if (isShelved)
    actions.push('<button class="act restore" onclick="restoreCase(\'' + c.id + '\')">↩ Restore</button>');
  actions.push('<button class="act del" onclick="removeCase(\'' + c.id + '\')">✕</button>');

  return '<div class="case-row' + (outlineOpen?'':' outline-closed') + '" id="r-' + c.id + '">' +
    '<div class="case-icon">' + ICON[c.stage] + '</div>' +
    '<div class="case-body">' +
      '<div class="case-title">' + esc(c.title) + '</div>' +
      '<div class="case-meta">' +
        '<span class="stage-badge" style="' + BADGE[c.stage] + '">' + c.stage + '</span>' +
        (outlined ? '<span class="outline-badge">✦ Outlined</span>' : '') +
        (meta ? '<span class="case-loc">' + esc(meta) + '</span>' : '') +
        '<span class="case-age">Updated ' + age(c.dateUpdated) + '</span>' +
      '</div>' +
      (c.notes ? '<div class="case-notes">' + esc(c.notes) + '</div>' : '') +
    '</div>' +
    '<div class="case-actions">' + actions.join('') + '</div>' +
    '</div>';
}

function outlinePanelHTML(c) {
  const o = c.outline || {};
  const outlined = hasOutline(c);
  const genDate  = o.generatedAt ? new Date(o.generatedAt).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '';

  const section = (label, content) => {
    const body = content
      ? '<div class="outline-section-body">' + esc(content) + '</div>'
      : '<div class="outline-empty">—</div>';
    return '<div class="outline-section">' +
      '<div class="outline-section-label">' + label + '</div>' +
      body +
      '</div>';
  };

  if (!outlined) {
    return '<div class="outline-panel-header">' +
        '<span class="outline-panel-title">Outline</span>' +
        '<span class="outline-panel-meta">Not yet generated</span>' +
        '<button class="outline-edit-btn" onclick="openEditOutline(\'' + c.id + '\')">+ Add Outline</button>' +
      '</div>' +
      '<div class="outline-prompt">' +
        '<div class="outline-prompt-text">Ask Claude to run the show-outline-skill for this case, or add content manually.</div>' +
      '</div>';
  }

  return '<div class="outline-panel-header">' +
      '<span class="outline-panel-title">Outline</span>' +
      '<span class="outline-panel-meta">' + (genDate ? 'Generated ' + genDate : '') + '</span>' +
      '<button class="outline-edit-btn" onclick="openEditOutline(\'' + c.id + '\')">Edit</button>' +
    '</div>' +
    '<div class="outline-sections">' +
      section('Cold Open Hook', o.coldOpen) +
      section('Case Timeline', o.timeline) +
      section('Suspect Profiles', o.suspects) +
      section('Episode Structure', o.structure) +
      '<div class="outline-section full-width" style="border-bottom:none">' +
        '<div class="outline-section-label">Production Notes</div>' +
        (o.production
          ? '<div class="outline-section-body">' + esc(o.production) + '</div>'
          : '<div class="outline-empty">—</div>') +
      '</div>' +
    '</div>';
}

// ─── Outline toggle ────────────────────────────────────────────────────────────
function toggleOutline(id) {
  const panel = document.getElementById('op-' + id);
  const row   = document.getElementById('r-' + id);
  if (!panel) return;

  if (expanded.has(id)) {
    expanded.delete(id);
    panel.style.display = 'none';
    row.classList.add('outline-closed');
    const btn = row.querySelector('.outline-act');
    if (btn) { btn.textContent = '▼ Outline'; btn.classList.remove('open'); }
  } else {
    expanded.add(id);
    panel.style.display = 'block';
    row.classList.remove('outline-closed');
    const btn = row.querySelector('.outline-act');
    if (btn) { btn.textContent = '▲ Outline'; btn.classList.add('open'); }
  }
}

// ─── Outline edit ─────────────────────────────────────────────────────────────
function openEditOutline(id) {
  const c = cases.find(x => x.id === id);
  if (!c) return;
  outlineId = id;
  const o = c.outline || {};
  document.getElementById('outlineModalTitle').textContent = 'Outline · ' + c.title;
  document.getElementById('oColdOpen').value   = o.coldOpen   || '';
  document.getElementById('oTimeline').value   = o.timeline   || '';
  document.getElementById('oSuspects').value   = o.suspects   || '';
  document.getElementById('oStructure').value  = o.structure  || '';
  document.getElementById('oProduction').value = o.production || '';
  document.getElementById('outlineOverlay').classList.add('open');
}

function saveOutlineEdit() {
  const c = cases.find(x => x.id === outlineId);
  if (!c) return;
  c.outline = {
    coldOpen:    document.getElementById('oColdOpen').value.trim(),
    timeline:    document.getElementById('oTimeline').value.trim(),
    suspects:    document.getElementById('oSuspects').value.trim(),
    structure:   document.getElementById('oStructure').value.trim(),
    production:  document.getElementById('oProduction').value.trim(),
    generatedAt: (c.outline && c.outline.generatedAt) || new Date().toISOString()
  };
  if (hasOutline(c)) {
    c.outline.generatedAt = new Date().toISOString();
  }
  c.dateUpdated = new Date().toISOString();
  persist();
  closeOutlineEdit();
  render();
  if (expanded.has(outlineId)) {
    const panel = document.getElementById('op-' + outlineId);
    if (panel) panel.style.display = 'block';
  }
}

function closeOutlineEdit() {
  outlineId = null;
  document.getElementById('outlineOverlay').classList.remove('open');
}

// ─── Add form ─────────────────────────────────────────────────────────────────
function toggleForm() {
  const f = document.getElementById('addForm');
  const open = f.classList.toggle('open');
  document.getElementById('addToggleBtn').textContent = open ? '✕ Cancel' : '+ Add Case';
  if (open) document.getElementById('nTitle').focus();
}

function addCase() {
  const title = document.getElementById('nTitle').value.trim();
  if (!title) { document.getElementById('nTitle').focus(); return; }

  const c = {
    id:          uid(),
    title,
    stage:       document.getElementById('nStage').value,
    location:    document.getElementById('nLocation').value.trim(),
    year:        document.getElementById('nYear').value.trim(),
    notes:       document.getElementById('nNotes').value.trim(),
    dateAdded:   new Date().toISOString(),
    dateUpdated: new Date().toISOString(),
    outline:     { coldOpen:'', timeline:'', suspects:'', structure:'', production:'', generatedAt:'' }
  };

  cases.unshift(c);
  persist();

  ['nTitle','nLocation','nYear','nNotes'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('nStage').value = 'Discovery';
  document.getElementById('addForm').classList.remove('open');
  document.getElementById('addToggleBtn').textContent = '+ Add Case';

  curTab = c.stage;
  render();
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function moveFwd(id) {
  const c = cases.find(x => x.id===id);
  if (!c) return;
  const idx = stageIdx(c.stage);
  if (idx < STAGES.length-1) {
    c.stage = STAGES[idx+1];
    c.dateUpdated = new Date().toISOString();
    persist();
    curTab = c.stage;
    render();
  }
}

function shelveCase(id) {
  const c = cases.find(x => x.id===id);
  if (!c) return;
  c.stage = 'Shelved';
  c.dateUpdated = new Date().toISOString();
  persist(); render();
}

function restoreCase(id) {
  const c = cases.find(x => x.id===id);
  if (!c) return;
  c.stage = 'Discovery';
  c.dateUpdated = new Date().toISOString();
  persist();
  curTab = 'Discovery';
  render();
}

function archive(id) { render(); }

function removeCase(id) {
  if (!confirm('Remove this case from the pipeline? This cannot be undone.')) return;
  cases = cases.filter(x => x.id!==id);
  expanded.delete(id);
  persist(); render();
}

// ─── Edit modal ───────────────────────────────────────────────────────────────
function openEdit(id) {
  const c = cases.find(x => x.id===id);
  if (!c) return;
  editId = id;
  document.getElementById('eTitle').value    = c.title;
  document.getElementById('eStage').value    = c.stage;
  document.getElementById('eLocation').value = c.location || '';
  document.getElementById('eYear').value     = c.year || '';
  document.getElementById('eNotes').value    = c.notes || '';
  document.getElementById('editOverlay').classList.add('open');
}

function saveEdit() {
  const c = cases.find(x => x.id===editId);
  if (!c) return;
  const t = document.getElementById('eTitle').value.trim();
  if (t) c.title = t;
  c.stage    = document.getElementById('eStage').value;
  c.location = document.getElementById('eLocation').value.trim();
  c.year     = document.getElementById('eYear').value.trim();
  c.notes    = document.getElementById('eNotes').value.trim();
  c.dateUpdated = new Date().toISOString();
  persist();
  closeEdit();
  render();
}

function closeEdit() {
  editId = null;
  document.getElementById('editOverlay').classList.remove('open');
}

function overlayClick(e, overlayId) {
  if (e.target === document.getElementById(overlayId)) {
    if (overlayId === 'editOverlay') closeEdit();
    if (overlayId === 'outlineOverlay') closeOutlineEdit();
  }
}
</script>
</body>
</html>
