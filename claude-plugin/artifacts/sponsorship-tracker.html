<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Sponsorship Tracker",
  "schemaVersion": 1
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsorship Tracker</title>
<style>
:root { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0f0f0f; color:#f0ece3; font-family:Georgia,'Times New Roman',serif; min-height:100vh; padding:28px 24px; }

.header { border-bottom:1px solid #242424; padding-bottom:20px; margin-bottom:24px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.show-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a84c; margin-bottom:5px; font-family:'Courier New',monospace; }
.title { font-size:28px; font-weight:normal; }
.updated { font-size:11px; color:#4a4a4a; font-family:'Courier New',monospace; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
.stat-card { background:#171717; border:1px solid #242424; border-radius:3px; padding:16px 18px; }
.stat-label { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:#555; margin-bottom:10px; font-family:'Courier New',monospace; }
.stat-value { font-size:26px; color:#f0ece3; line-height:1; }
.stat-value.gold { color:#c9a84c; }
.stat-value.green { color:#5aab7d; }
.stat-value.red { color:#c05454; }
.stat-sub { font-size:10px; color:#454545; margin-top:6px; font-family:'Courier New',monospace; }

.filters { display:flex; margin-bottom:18px; border:1px solid #242424; border-radius:3px; overflow:hidden; width:fit-content; }
.filter-btn { background:transparent; border:none; border-right:1px solid #242424; color:#555; cursor:pointer; font-family:'Courier New',monospace; font-size:11px; letter-spacing:1.5px; padding:8px 16px; text-transform:uppercase; transition:all .15s; }
.filter-btn:last-child { border-right:none; }
.filter-btn:hover { background:#1a1a1a; color:#c9a84c; }
.filter-btn.active { background:#c9a84c; color:#0f0f0f; font-weight:bold; }

.deals { display:flex; flex-direction:column; gap:8px; }
.deal-card { background:#171717; border:1px solid #242424; border-left:3px solid #2a2a2a; border-radius:3px; padding:15px 18px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; }
.deal-card[data-status="overdue"]   { border-left-color:#c05454; }
.deal-card[data-status="upcoming"]  { border-left-color:#d4883a; }
.deal-card[data-status="completed"] { border-left-color:#5aab7d; }
.deal-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:7px; }
.deal-company { font-size:15px; color:#f0ece3; }
.badge { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 7px; border-radius:2px; font-family:'Courier New',monospace; }
.badge-type     { background:#1f1f1f; color:#666; border:1px solid #2d2d2d; }
.badge-overdue  { background:rgba(192,84,84,.12); color:#c05454; border:1px solid rgba(192,84,84,.25); }
.badge-upcoming { background:rgba(212,136,58,.12); color:#d4883a; border:1px solid rgba(212,136,58,.25); }
.badge-completed{ background:rgba(90,171,125,.12); color:#5aab7d; border:1px solid rgba(90,171,125,.25); }
.deal-meta { font-size:11px; color:#555; font-family:'Courier New',monospace; display:flex; gap:18px; flex-wrap:wrap; }
.deal-note { color:#c9a84c; }
.deal-right { text-align:right; display:flex; flex-direction:column; gap:7px; align-items:flex-end; min-width:110px; }
.deal-rate { font-size:20px; color:#c9a84c; }
.inv-badge { font-size:9px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:2px; font-family:'Courier New',monospace; }
.inv-paid    { background:rgba(90,171,125,.12); color:#5aab7d; border:1px solid rgba(90,171,125,.25); }
.inv-pending { background:rgba(192,84,84,.12);  color:#c05454; border:1px solid rgba(192,84,84,.25); }
.inv-not     { background:#1a1a1a; color:#444; border:1px solid #272727; }

.state-msg { text-align:center; padding:60px 20px; font-family:'Courier New',monospace; font-size:12px; letter-spacing:1px; color:#444; }
.state-msg.error { color:#c05454; }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid #2a2a2a; border-top-color:#c9a84c; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="show-label" id="show-label">Podcast Dashboard</div>
    <div class="title">Sponsorship Tracker</div>
  </div>
  <div class="updated" id="updated-time"></div>
</div>

<div class="stats" id="stats">
  <div class="stat-card"><div class="stat-label">Committed Revenue</div><div class="stat-value gold" id="s-committed">—</div><div class="stat-sub" id="s-committed-sub">loading…</div></div>
  <div class="stat-card"><div class="stat-label">Revenue Received</div><div class="stat-value green" id="s-received">—</div><div class="stat-sub" id="s-received-sub">loading…</div></div>
  <div class="stat-card"><div class="stat-label">Due This Month</div><div class="stat-value" id="s-due">—</div><div class="stat-sub" id="s-due-sub">loading…</div></div>
  <div class="stat-card"><div class="stat-label">Overdue Reads</div><div class="stat-value red" id="s-overdue">—</div><div class="stat-sub" id="s-overdue-sub">loading…</div></div>
</div>

<div class="filters" id="filter-bar" style="display:none">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="upcoming">Upcoming</button>
  <button class="filter-btn" data-filter="overdue">Overdue</button>
  <button class="filter-btn" data-filter="completed">Completed</button>
</div>

<div id="deal-list" class="deals"></div>
<div id="state-display" class="state-msg"><span class="spinner"></span>Loading from Google Sheets…</div>

<script>
const DEMO_SHEET_ID   = '1xSBdh6omlci1ckMJfV5_rjDpQVruPzHpDDY-j5JApiE';
const SPREADSHEET_ID  = localStorage.getItem('podcastDashboardSheetId') || DEMO_SHEET_ID;
const IS_DEMO         = !localStorage.getItem('podcastDashboardSheetId');
const MCP_TOOL = 'mcp__8935aad1-1da9-45a2-9cb4-f22ab8e10861__google_sheets_get_data_range';

const statusBadge = { overdue:{cls:'badge-overdue',txt:'OVERDUE'}, upcoming:{cls:'badge-upcoming',txt:'UPCOMING'}, completed:{cls:'badge-completed',txt:'COMPLETED'} };
const invBadge    = { paid:{cls:'inv-paid',txt:'Paid'}, pending:{cls:'inv-pending',txt:'Invoice Pending'}, not:{cls:'inv-not',txt:'Not Invoiced'} };

const parseRate = r => parseFloat((r || '0').replace(/[$,]/g, '')) || 0;
const fmt       = n => '$' + n.toLocaleString('en-US');

let allDeals = [];

async function loadData() {
  try {
    const res = await window.cowork.callMcpTool(MCP_TOOL, {
      instructions: 'Get all sponsorship deal rows',
      spreadsheet: SPREADSHEET_ID,
      worksheet: 'Sheet1',
      a1_range: 'A1:I100',
      output_hint: 'all rows and columns as raw data'
    });

    const rows = (res.results || []).slice(1).filter(r => r['COL$A']);
    allDeals = rows.map(r => ({
      company: r['COL$A'] || '',
      type:    r['COL$B'] || '',
      episode: r['COL$C'] || '',
      title:   r['COL$D'] || '',
      airDate: r['COL$E'] || '',
      status:  (r['COL$F'] || '').toLowerCase().trim(),
      rate:    r['COL$G'] || '$0',
      invoice: (r['COL$H'] || '').toLowerCase().trim(),
      note:    r['COL$I'] || ''
    }));

    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear  = now.getFullYear();

    const committed = allDeals.reduce((s,d) => s + parseRate(d.rate), 0);
    const received  = allDeals.filter(d => d.invoice === 'paid').reduce((s,d) => s + parseRate(d.rate), 0);
    const paidCount = allDeals.filter(d => d.invoice === 'paid').length;

    const dueDeals = allDeals.filter(d => {
      if (d.status !== 'upcoming') return false;
      const parsed = new Date(d.airDate);
      return !isNaN(parsed) && parsed.getMonth() === thisMonth && parsed.getFullYear() === thisYear;
    });
    const dueAmt   = dueDeals.reduce((s,d) => s + parseRate(d.rate), 0);
    const overdueCount = allDeals.filter(d => d.status === 'overdue').length;
    const overdueDeals = allDeals.filter(d => d.status === 'overdue');

    document.getElementById('s-committed').textContent = fmt(committed);
    document.getElementById('s-committed-sub').textContent = allDeals.length + ' deals total';
    document.getElementById('s-received').textContent = fmt(received);
    document.getElementById('s-received-sub').textContent = paidCount + ' invoice' + (paidCount !== 1 ? 's' : '') + ' paid';
    document.getElementById('s-due').textContent = fmt(dueAmt);
    document.getElementById('s-due-sub').textContent = dueDeals.map(d => d.episode).join(' + ') || 'none this month';
    document.getElementById('s-overdue').textContent = overdueCount;
    document.getElementById('s-overdue-sub').textContent = overdueCount ? overdueDeals.map(d => d.company).join(', ') : 'all clear';

    const upCount = allDeals.filter(d => d.status === 'upcoming').length;
    const compCount = allDeals.filter(d => d.status === 'completed').length;
    document.querySelector('[data-filter="all"]').textContent    = `All (${allDeals.length})`;
    document.querySelector('[data-filter="upcoming"]').textContent   = `Upcoming (${upCount})`;
    document.querySelector('[data-filter="overdue"]').textContent    = `Overdue (${overdueCount})`;
    document.querySelector('[data-filter="completed"]').textContent  = `Completed (${compCount})`;

    document.getElementById('state-display').style.display = 'none';
    document.getElementById('filter-bar').style.display = 'flex';

    const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
    render(activeFilter);

    const showName = localStorage.getItem('podcastDashboardShowName');
    const seasonLabel = localStorage.getItem('podcastDashboardSeasonLabel');
    const showLabel = showName ? (showName + (seasonLabel ? ' · ' + seasonLabel : '')) : 'Who Killed…? · Season 3';
    document.getElementById('show-label').textContent = showLabel;
    if (IS_DEMO) {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:3px;color:#7a6530;font-family:Courier New,monospace;font-size:10px;letter-spacing:1px;padding:8px 14px;margin-bottom:18px;';
      banner.textContent = '⚠ Using demo data — run the Setup Wizard to connect your sheet.';
      document.querySelector('.filters').before(banner);
    }
    document.getElementById('updated-time').textContent =
      'Updated ' + now.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'});

  } catch(e) {
    const detail = e && e.message ? e.message : String(e);
    const el = document.getElementById('state-display');
    el.className = 'state-msg error';
    el.innerHTML =
      '<div style="font-size:20px;margin-bottom:10px">⚠</div>' +
      '<div style="font-size:13px;color:#c05454;margin-bottom:8px">Google Sheets connector unavailable</div>' +
      '<div style="font-size:11px;color:#555;margin-bottom:16px;line-height:1.7">' +
        'Reconnect your Google Sheets connector in Cowork settings, then reload this artifact.<br>' +
        '<span style="color:#333;font-size:10px">(' + detail + ')</span>' +
      '</div>' +
      '<button onclick="loadData()" style="background:none;border:1px solid rgba(201,168,76,.4);color:#c9a84c;font-family:\'Courier New\',monospace;font-size:11px;padding:7px 18px;border-radius:3px;cursor:pointer;letter-spacing:.05em">↻ Try Again</button>';
  }
}

function render(filter) {
  const list = document.getElementById('deal-list');
  const data = filter === 'all' ? allDeals : allDeals.filter(d => d.status === filter);
  if (!data.length) { list.innerHTML = '<div class="state-msg">No deals in this category.</div>'; return; }
  list.innerHTML = data.map(d => {
    const sb = statusBadge[d.status] || {cls:'badge-type', txt: d.status.toUpperCase()};
    const ib = invBadge[d.invoice]   || invBadge['not'];
    return `<div class="deal-card" data-status="${d.status}">
      <div>
        <div class="deal-top">
          <span class="deal-company">${d.company}</span>
          <span class="badge badge-type">${d.type}</span>
          <span class="badge ${sb.cls}">${sb.txt}</span>
        </div>
        <div class="deal-meta">
          <span>${d.episode}${d.title ? ' · ' + d.title : ''}</span>
          ${d.airDate ? '<span>Airs ' + d.airDate + '</span>' : ''}
          ${d.note ? '<span class="deal-note">↳ ' + d.note + '</span>' : ''}
        </div>
      </div>
      <div class="deal-right">
        <div class="deal-rate">${d.rate}</div>
        <span class="inv-badge ${ib.cls}">${ib.txt}</span>
      </div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

loadData();
</script>
</body>
</html>
