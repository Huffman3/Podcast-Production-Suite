<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Guest Crm",
  "schemaVersion": 1
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest CRM</title>
<style>
:root { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0f0f0f; color:#f0ece3; font-family:Georgia,'Times New Roman',serif; min-height:100vh; padding:28px 24px; }

.header { border-bottom:1px solid #242424; padding-bottom:20px; margin-bottom:24px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.show-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#c9a84c; margin-bottom:5px; font-family:'Courier New',monospace; }
.title { font-size:28px; font-weight:normal; }
.updated { font-size:11px; color:#4a4a4a; font-family:'Courier New',monospace; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card { background:#171717; border:1px solid #242424; border-radius:3px; padding:16px 18px; }
.stat-label { font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:#555; margin-bottom:10px; font-family:'Courier New',monospace; }
.stat-value { font-size:26px; color:#f0ece3; line-height:1; }
.stat-value.gold   { color:#c9a84c; }
.stat-value.green  { color:#5aab7d; }
.stat-value.red    { color:#c05454; }
.stat-value.purple { color:#9b6dd4; }
.stat-sub { font-size:10px; color:#454545; margin-top:6px; font-family:'Courier New',monospace; }

.alert-strip { display:flex; flex-direction:column; gap:6px; margin-bottom:20px; }
.alert-item { background:rgba(192,84,84,.08); border:1px solid rgba(192,84,84,.2); border-left:3px solid #c05454; border-radius:3px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; font-family:'Courier New',monospace; font-size:11px; }
.alert-name { color:#f0ece3; font-size:13px; font-family:Georgia,serif; }
.alert-detail { color:#c05454; font-size:10px; letter-spacing:.5px; margin-top:2px; }
.alert-badge { background:rgba(192,84,84,.15); color:#c05454; border:1px solid rgba(192,84,84,.3); font-size:9px; letter-spacing:1.5px; padding:2px 8px; border-radius:2px; text-transform:uppercase; white-space:nowrap; }

.filters { display:flex; flex-wrap:wrap; gap:0; margin-bottom:18px; border:1px solid #242424; border-radius:3px; overflow:hidden; width:fit-content; }
.filter-btn { background:transparent; border:none; border-right:1px solid #242424; color:#555; cursor:pointer; font-family:'Courier New',monospace; font-size:11px; letter-spacing:1px; padding:7px 14px; text-transform:uppercase; transition:all .15s; white-space:nowrap; }
.filter-btn:last-child { border-right:none; }
.filter-btn:hover { background:#1a1a1a; color:#c9a84c; }
.filter-btn.active { background:#c9a84c; color:#0f0f0f; font-weight:bold; }

.guests { display:flex; flex-direction:column; gap:8px; }
.guest-card { background:#171717; border:1px solid #242424; border-left:3px solid #2a2a2a; border-radius:3px; padding:15px 18px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; }
.guest-card[data-stage="discovered"] { border-left-color:#555; }
.guest-card[data-stage="outreached"] { border-left-color:#d4883a; }
.guest-card[data-stage="responded"]  { border-left-color:#4a7fc1; }
.guest-card[data-stage="confirmed"]  { border-left-color:#c9a84c; }
.guest-card[data-stage="recorded"]   { border-left-color:#9b6dd4; }
.guest-card[data-stage="aired"]      { border-left-color:#5aab7d; }
.guest-card[data-stage="cold"]       { border-left-color:#282828; opacity:.6; }
.guest-card.overdue { background:#1a1515; }

.guest-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:7px; }
.guest-name { font-size:15px; color:#f0ece3; }

.badge { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 7px; border-radius:2px; font-family:'Courier New',monospace; }
.badge-role { background:#1f1f1f; color:#666; border:1px solid #2d2d2d; }

.stage-badge-discovered { background:rgba(100,100,100,.12); color:#888; border:1px solid rgba(100,100,100,.25); }
.stage-badge-outreached { background:rgba(212,136,58,.12); color:#d4883a; border:1px solid rgba(212,136,58,.25); }
.stage-badge-responded  { background:rgba(74,127,193,.12); color:#4a7fc1; border:1px solid rgba(74,127,193,.25); }
.stage-badge-confirmed  { background:rgba(201,168,76,.12); color:#c9a84c; border:1px solid rgba(201,168,76,.25); }
.stage-badge-recorded   { background:rgba(155,109,212,.12); color:#9b6dd4; border:1px solid rgba(155,109,212,.25); }
.stage-badge-aired      { background:rgba(90,171,125,.12); color:#5aab7d; border:1px solid rgba(90,171,125,.25); }
.stage-badge-cold       { background:rgba(40,40,40,.5); color:#444; border:1px solid #2a2a2a; }

.guest-meta { font-size:11px; color:#555; font-family:'Courier New',monospace; display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:5px; }
.guest-topic { font-size:12px; color:#888; margin-bottom:6px; }
.guest-note { font-size:11px; color:#c9a84c; font-family:'Courier New',monospace; }
.overdue-warn { font-size:10px; color:#c05454; font-family:'Courier New',monospace; letter-spacing:.5px; margin-top:4px; }

.guest-right { text-align:right; display:flex; flex-direction:column; gap:5px; align-items:flex-end; min-width:80px; padding-top:2px; }
.ep-tag { font-size:11px; font-family:'Courier New',monospace; color:#555; }
.ep-tag.assigned { color:#c9a84c; }

.state-msg { text-align:center; padding:60px 20px; font-family:'Courier New',monospace; font-size:12px; letter-spacing:1px; color:#444; }
.state-msg.error { color:#c05454; }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid #2a2a2a; border-top-color:#c9a84c; border-radius:50%; animation:spin .8s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

.section-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:#333; font-family:'Courier New',monospace; border-bottom:1px solid #1a1a1a; padding-bottom:6px; margin-bottom:10px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="show-label" id="show-label">Podcast Dashboard</div>
    <div class="title">Guest CRM</div>
  </div>
  <div class="updated" id="updated-time"></div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-label">In Pipeline</div><div class="stat-value" id="s-pipeline">—</div><div class="stat-sub" id="s-pipeline-sub">active stages</div></div>
  <div class="stat-card"><div class="stat-label">Confirmed</div><div class="stat-value gold" id="s-confirmed">—</div><div class="stat-sub">ready to record</div></div>
  <div class="stat-card"><div class="stat-label">Need Follow-Up</div><div class="stat-value red" id="s-followup">—</div><div class="stat-sub" id="s-followup-sub">overdue contacts</div></div>
  <div class="stat-card"><div class="stat-label">Aired</div><div class="stat-value green" id="s-aired">—</div><div class="stat-sub">published guests</div></div>
</div>

<div id="alert-section" style="display:none">
  <div class="section-label" style="margin-bottom:8px">Follow-Up Needed</div>
  <div class="alert-strip" id="alert-strip"></div>
</div>

<div class="filters" id="filter-bar" style="display:none"></div>

<div id="guest-list" class="guests"></div>
<div id="state-display" class="state-msg"><span class="spinner"></span>Loading from Google Sheets…</div>

<script>
const DEMO_SHEET_ID  = '1xSBdh6omlci1ckMJfV5_rjDpQVruPzHpDDY-j5JApiE';
const SPREADSHEET_ID = localStorage.getItem('podcastDashboardSheetId') || DEMO_SHEET_ID;
const IS_DEMO        = !localStorage.getItem('podcastDashboardSheetId');
const MCP_TOOL       = 'mcp__8935aad1-1da9-45a2-9cb4-f22ab8e10861__google_sheets_get_data_range';

const ACTIVE_STAGES = ['discovered','outreached','responded','confirmed','recorded'];
const FOLLOWUP_DAYS = { outreached: 14, responded: 21 };

const STAGE_ORDER = ['discovered','outreached','responded','confirmed','recorded','aired','cold'];

const stageBadge = s => `badge stage-badge-${s||'discovered'}`;
const stageTxt   = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '—';

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d) / 86400000);
}

function isOverdue(g) {
  const threshold = FOLLOWUP_DAYS[g.stage];
  if (!threshold) return false;
  const ref = g.stage === 'outreached' ? g.outreachDate : g.lastContact;
  const days = daysSince(ref);
  return days !== null && days > threshold;
}

function overdueLabel(g) {
  const ref = g.stage === 'outreached' ? g.outreachDate : g.lastContact;
  const days = daysSince(ref);
  if (days === null) return 'Overdue';
  return `${days} days since last contact — follow up`;
}

let allGuests = [];
let activeFilter = 'all';

async function loadData() {
  try {
    const res = await window.cowork.callMcpTool(MCP_TOOL, {
      instructions: 'Get all guest CRM rows from the Guests worksheet',
      spreadsheet: SPREADSHEET_ID,
      worksheet: 'Guests',
      a1_range: 'A1:H200',
      output_hint: 'all rows and columns as raw data'
    });

    const rows = (res.results || []).slice(1).filter(r => r['COL$A']);
    allGuests = rows.map(r => ({
      name:         r['COL$A'] || '',
      role:         r['COL$B'] || '',
      topic:        r['COL$C'] || '',
      stage:        (r['COL$D'] || 'discovered').toLowerCase().trim(),
      outreachDate: r['COL$E'] || '',
      lastContact:  r['COL$F'] || '',
      episode:      r['COL$G'] || '',
      notes:        r['COL$H'] || ''
    }));

    const pipeline  = allGuests.filter(g => ACTIVE_STAGES.includes(g.stage)).length;
    const confirmed = allGuests.filter(g => g.stage === 'confirmed').length;
    const aired     = allGuests.filter(g => g.stage === 'aired').length;
    const overdue   = allGuests.filter(isOverdue);

    document.getElementById('s-pipeline').textContent  = pipeline;
    document.getElementById('s-confirmed').textContent = confirmed;
    document.getElementById('s-followup').textContent  = overdue.length;
    document.getElementById('s-followup-sub').textContent = overdue.length ? overdue.map(g => g.name.split(' ')[0]).join(', ') : 'all clear';
    document.getElementById('s-aired').textContent     = aired;

    const sName  = localStorage.getItem('podcastDashboardShowName');
    const sSeason = localStorage.getItem('podcastDashboardSeasonLabel');
    document.getElementById('show-label').textContent =
      sName ? sName + (sSeason ? ' · ' + sSeason : '') : 'Who Killed…? · Season 3';

    if (IS_DEMO) {
      const b = document.createElement('div');
      b.style.cssText = 'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:3px;color:#7a6530;font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:1px;padding:8px 14px;margin-bottom:16px;';
      b.textContent = '⚠ Using demo data — run the Setup Wizard to connect your sheet.';
      document.getElementById('filter-bar').before(b);
    }

    if (overdue.length) {
      document.getElementById('alert-section').style.display = 'block';
      document.getElementById('alert-strip').innerHTML = overdue.map(g => `
        <div class="alert-item">
          <div>
            <div class="alert-name">${g.name}</div>
            <div class="alert-detail">${overdueLabel(g)}</div>
          </div>
          <span class="alert-badge">${stageTxt(g.stage)}</span>
        </div>`).join('');
    }

    const counts = {};
    STAGE_ORDER.forEach(s => { counts[s] = allGuests.filter(g => g.stage === s).length; });
    const filterBar = document.getElementById('filter-bar');
    const tabs = [['all', `All (${allGuests.length})`], ...STAGE_ORDER.filter(s => counts[s] > 0).map(s => [s, `${stageTxt(s)} (${counts[s]})`])];
    filterBar.innerHTML = tabs.map(([val, lbl]) =>
      `<button class="filter-btn${val === 'all' ? ' active' : ''}" data-filter="${val}">${lbl}</button>`
    ).join('');
    filterBar.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      });
    });
    filterBar.style.display = 'flex';

    document.getElementById('state-display').style.display = 'none';
    document.getElementById('updated-time').textContent =
      'Updated ' + new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'});

    render();

  } catch(e) {
    const detail = e && e.message ? e.message : String(e);
    const el = document.getElementById('state-display');
    el.className = 'state-msg error';
    el.innerHTML =
      '<div style="font-size:20px;margin-bottom:10px">⚠</div>' +
      '<div style="font-size:13px;color:#c05454;margin-bottom:8px">Google Sheets connector unavailable</div>' +
      '<div style="font-size:11px;color:#555;margin-bottom:16px;line-height:1.7">' +
        'Reconnect your Google Sheets connector in Cowork settings, then reload this artifact.<br>' +
        '<span style="color:#333;font-size:10px">(' + detail + ')</span>' +
      '</div>' +
      '<button onclick="loadData()" style="background:none;border:1px solid rgba(201,168,76,.4);color:#c9a84c;font-family:\'Courier New\',monospace;font-size:11px;padding:7px 18px;border-radius:3px;cursor:pointer;letter-spacing:.05em">↻ Try Again</button>';
  }
}

function render() {
  const list = document.getElementById('guest-list');
  const data = activeFilter === 'all' ? allGuests : allGuests.filter(g => g.stage === activeFilter);
  if (!data.length) { list.innerHTML = '<div class="state-msg">No guests in this stage.</div>'; return; }

  list.innerHTML = data.map(g => {
    const overdue = isOverdue(g);
    const epTxt   = g.episode && g.episode !== 'TBD' ? g.episode : '';
    return `<div class="guest-card${overdue ? ' overdue' : ''}" data-stage="${g.stage}">
      <div>
        <div class="guest-top">
          <span class="guest-name">${g.name}</span>
          ${g.role ? `<span class="badge badge-role">${g.role}</span>` : ''}
          <span class="badge ${stageBadge(g.stage)}">${stageTxt(g.stage)}</span>
        </div>
        ${g.topic ? `<div class="guest-topic">${g.topic}</div>` : ''}
        <div class="guest-meta">
          ${g.outreachDate ? `<span>Outreached ${g.outreachDate}</span>` : ''}
          ${g.lastContact && g.lastContact !== g.outreachDate ? `<span>Last contact ${g.lastContact}</span>` : ''}
        </div>
        ${g.notes ? `<div class="guest-note">↳ ${g.notes}</div>` : ''}
        ${overdue ? `<div class="overdue-warn">⚠ ${overdueLabel(g)}</div>` : ''}
      </div>
      <div class="guest-right">
        ${epTxt ? `<span class="ep-tag assigned">${epTxt}</span>` : `<span class="ep-tag">Unassigned</span>`}
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
